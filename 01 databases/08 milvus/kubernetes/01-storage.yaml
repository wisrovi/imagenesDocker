# This file defines PersistentVolumes (PVs) and PersistentVolumeClaims (PVCs).
# It uses `hostPath` for persistence, which is suitable for a single-node
# Kubernetes cluster (like Minikube or Docker Desktop). 
# WARNING: This is NOT a production-ready configuration. For a multi-node cluster,
# you would need a network-based storage solution (e.g., NFS, Ceph, or a cloud provider's storage).

apiVersion: v1
kind: PersistentVolume
metadata:
  name: etcd-pv
  namespace: milvus
  labels:
    type: local
    app: etcd
spec:
  storageClassName: manual
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/mnt/data/etcd"

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: etcd-pvc
  namespace: milvus
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---

