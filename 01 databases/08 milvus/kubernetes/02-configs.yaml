apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: milvus
type: Opaque
data:
  MINIO_ROOT_USER: bWluaW9hZG1pbg==
  MINIO_ROOT_PASSWORD: bWluaW9hZG1pbg==
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: milvus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'milvus'
        static_configs:
          - targets: ['milvus-standalone.milvus.svc.cluster.local:9091']
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: milvus
data:
  prometheus-datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.milvus.svc.cluster.local:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: milvus
data:
  dashboard-provider.yml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
