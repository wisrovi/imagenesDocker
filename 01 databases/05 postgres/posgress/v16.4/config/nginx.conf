events {
    worker_connections 1024;
}

http {
    upstream postgres {
        server postgres:5432;
    }

    # upstream pgbouncer {
    #     server pgbouncer:6432;
    # }

    upstream postgrest {
        server postgrest:3000;
    }

    upstream pgadmin {
        server pgadmin:80;
    }

    upstream prometheus {
        server prometheus:9090;
    }

    upstream grafana {
        server grafana:3000;
    }

    upstream redis {
        server redis:6379;
    }

    upstream docs {
        server docs:8000;
    }

    upstream elasticsearch {
        server elasticsearch:9200;
    }

    upstream kibana {
        server kibana:5601;
    }

    server {
        listen 80;
        server_name localhost;

        # PostgreSQL direct (if needed, but usually not exposed)
        location /postgres/ {
            proxy_pass http://postgres/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # PgBouncer
        # location /pgbouncer/ {
        #     proxy_pass http://pgbouncer/;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        # }

        # PostgREST API
        location /api/ {
            proxy_pass http://postgrest/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # pgAdmin
        location /pgadmin/ {
            proxy_pass http://pgadmin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Prometheus
        location /prometheus/ {
            proxy_pass http://prometheus/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Grafana
        location /grafana/ {
            proxy_pass http://grafana/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Docs
        location /docs/ {
            proxy_pass http://docs/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Elasticsearch
        location /elasticsearch/ {
            proxy_pass http://elasticsearch/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Kibana
        location /kibana/ {
            proxy_pass http://kibana/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Default
        location / {
            return 200 "Nginx Proxy\n\nAvailable paths:\n/api - PostgREST\n/pgadmin - pgAdmin\n/prometheus - Prometheus\n/grafana - Grafana\n/docs - Documentation\n/elasticsearch - Elasticsearch\n/kibana - Kibana";
            add_header Content-Type text/plain;
        }
    }
}