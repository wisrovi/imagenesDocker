[databases]
test_eyesnroad = host=postgres port=5432 dbname=test_eyesnroad

[pgbouncer]
listen_port = 6432
listen_addr = 0.0.0.0
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid
admin_users = perseus
stats_users = perseus
pool_mode = transaction
max_client_conn = 100
default_pool_size = 20
reserve_pool_size = 5