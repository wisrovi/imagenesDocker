# Docker Compose configuration for custom PostgreSQL setup

services:
  postgres:
    # Build the custom image from the Dockerfile
    build:
      context: .
      dockerfile: Dockerfile
    # Tag the built image
    image: wisrovi/postgres:v16.4
    # Environment variables for PostgreSQL
    env_file:
      - .env
    # Persistent volume for database data (named volume for portability)
    volumes:
      - ./data/db:/var/lib/postgresql/data
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf
    # Resource limits (for Docker Compose, use these instead of deploy for non-Swarm)
    mem_limit: 1024m
    cpus: 0.50
    # Port mapping
    ports:
      - '5433:5432'
    # Use custom config file
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perseus -d test_eyesnroad"]
      interval: 30s
      timeout: 10s
      retries: 3

  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    # ports:
    #   - '6432:6432'
    volumes:
      - ./config/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini
      - ./config/userlist.txt:/etc/pgbouncer/userlist.txt
    depends_on:
      - postgres
    environment:
      - PGBOUNCER_CONFIG_FILE=/etc/pgbouncer/pgbouncer.ini
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432", "-U", "perseus"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    env_file:
      - .env
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      - postgres
    ports:
      - '9187:9187'

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    # ports:
    #   - '9090:9090'
    depends_on:
      - postgres-exporter

  grafana:
    image: grafana/grafana:latest
    # ports:
    #   - '3000:3000'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@perseus.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    # ports:
    #   - '5050:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

  backup:
    build:
      context: .
      dockerfile: Dockerfile
    image: wisrovi/postgres:v16.4
    volumes:
      - ./backups:/backups
    depends_on:
      - postgres
    command: sh -c "apt-get update && apt-get install -y cron && echo '0 2 * * * pg_dump -U perseus -h postgres perseus > /backups/backup_$(date +\\%Y\\%m\\%d).sql' > /etc/cron.d/backup && chmod 0644 /etc/cron.d/backup && crontab /etc/cron.d/backup && cron -f"

  redis:
    image: redis:latest
    # ports:
    #   - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  flyway:
    image: flyway/flyway:latest
    env_file:
      - .env
    environment:
      - FLYWAY_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - FLYWAY_USER=${POSTGRES_USER}
      - FLYWAY_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./migrations:/flyway/sql
    depends_on:
      - postgres
    command: migrate

  postgrest:
    image: postgrest/postgrest:latest
    # ports:
    #   - '3001:3000'
    env_file:
      - .env
    environment:
      - PGRST_DB_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - PGRST_DB_SCHEMA=public
      - PGRST_DB_ANON_ROLE=${POSTGRES_USER}
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  docs:
    build:
      context: .
      dockerfile: Dockerfile.docs
    # ports:
    #   - '8000:8000'
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  elasticsearch:
    image: elasticsearch:7.17.10
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    # ports:
    #   - '9200:9200'
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  logstash:
    image: logstash:7.17.10
    # ports:
    #   - '5044:5044'
    volumes:
      - ./config/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    depends_on:
      - elasticsearch
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9600 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  kibana:
    image: kibana:7.17.10
    # ports:
    #   - '5601:5601'
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:latest
    ports:
      - '8080:80'
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - postgres
      - pgbouncer
      - postgrest
      - pgadmin
      - prometheus
      - grafana
      - docs
      - elasticsearch
      - kibana
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  postgres_replica_data:
  grafana_data:
  pgadmin_data:
  redis_data:
  elasticsearch_data:




