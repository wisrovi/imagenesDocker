name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate Docker Compose
      run: |
        docker-compose config --quiet

    - name: Check shell scripts
      run: |
        shellcheck check-prerequisites.sh || true

    - name: Check Python syntax (if available)
      run: |
        python3 -m py_compile docs/conf.py || true

    - name: Check JSON files
      run: |
        python3 -c "import json; json.load(open('sample-config.json'))" || echo "JSON validation failed"

  docs:
    runs-on: ubuntu-latest
    needs: validate

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'

    - name: Install dependencies
      run: |
        cd docs
        pip install -r requirements.txt

    - name: Build documentation
      run: |
        cd docs
        make html

    - name: Upload documentation
      uses: actions/upload-artifact@v3
      with:
        name: docs
        path: docs/_build/html/

  test-docker:
    runs-on: ubuntu-latest
    needs: validate

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker Compose
      run: |
        docker-compose build --no-cache

    - name: Test Docker Compose up
      run: |
        docker-compose up -d
        sleep 10
        docker-compose ps
        docker-compose down