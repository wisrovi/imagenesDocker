services:
  mcp-inspector:
    image: ghcr.io/modelcontextprotocol/inspector:latest
    ports:
      - "3002:3000"
    # network_mode: host  # Commented out to use port mapping
    environment:
      - HOST=0.0.0.0
      - DANGEROUSLY_OMIT_AUTH=true
      - MCP_PROXY_FULL_ADDRESS=""
      - MCP_SERVER_REQUEST_TIMEOUT=${MCP_SERVER_REQUEST_TIMEOUT:-300000}
      - MCP_REQUEST_TIMEOUT_RESET_ON_PROGRESS=${MCP_REQUEST_TIMEOUT_RESET_ON_PROGRESS:-true}
      - MCP_REQUEST_MAX_TOTAL_TIMEOUT=${MCP_REQUEST_MAX_TOTAL_TIMEOUT:-60000}
      - MCP_AUTO_OPEN_ENABLED=${MCP_AUTO_OPEN_ENABLED:-true}
    # volumes:
    #   - ./fastmcp-config.json:/app/config.json:ro