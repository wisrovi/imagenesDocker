[metadata]
name = pr_analyzer
version = 0.1.0
author = Gemini
description = A tool to analyze GitHub Pull Requests.

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.8
install_requires =
    pandas
    requests
    python-dotenv
    pylint

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    analyze-repo = pr_analyzer.main:main
