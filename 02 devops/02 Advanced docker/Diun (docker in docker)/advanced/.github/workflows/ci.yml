name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'  # Daily security scan

env:
  DOCKER_BUILDKIT: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run shellcheck
      uses: ludeeus/action-shellcheck@master
      with:
        scandir: './scripts'

    - name: Run hadolint
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: ./docker/Dockerfile

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  test:
    runs-on: ubuntu-latest
    needs: [lint, security-scan]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache node modules
      uses: actions/cache@v3
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Build Docker images
      run: |
        docker-compose build --parallel

    - name: Start services
      run: |
        docker-compose up -d
        docker-compose wait dind

    - name: Wait for services to be ready
      run: |
        timeout 300 bash -c 'until docker-compose ps | grep -q "healthy\|running"; do sleep 5; done'

    - name: Run unit tests
      run: |
        chmod +x scripts/test.sh
        ./scripts/test.sh

    - name: Run integration tests
      run: |
        chmod +x scripts/integration_test.sh
        ./scripts/integration_test.sh

    - name: Run load tests
      run: |
        chmod +x scripts/load_test.sh
        ./scripts/load_test.sh

    - name: Run security tests
      run: |
        chmod +x scripts/security_test.sh
        ./scripts/security_test.sh

    - name: Build documentation
      run: |
        cd docs
        make html

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          test-results/
          coverage/

    - name: Upload documentation
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: docs/_build/html/

    - name: Stop services
      run: |
        docker-compose down -v

  deploy-staging:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push staging images
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/dind:staging-${{ github.sha }}
          ${{ secrets.DOCKER_USERNAME }}/dind:staging-latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy to staging
      run: |
        echo "🚀 Deploying to staging environment..."
        echo "STAGING_DEPLOYMENT=true" >> .env.staging
        # Here you would typically use docker-compose or kubernetes to deploy
        echo "✅ Staging deployment completed"

  deploy-production:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push production images
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/dind:${{ github.sha }}
          ${{ secrets.DOCKER_USERNAME }}/dind:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy to production
      run: |
        echo "🚀 Deploying to production environment..."
        echo "PRODUCTION_DEPLOYMENT=true" >> .env.production
        # Here you would typically use docker-compose or kubernetes to deploy
        echo "✅ Production deployment completed"

    - name: Create release
      if: github.event_name == 'push'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release v${{ github.run_number }}
        body: |
          ## Changes
          - Automated deployment to production
          - Docker images pushed to registry
          - All tests passed
        draft: false
        prerelease: false

  cleanup:
    runs-on: ubuntu-latest
    if: always()
    needs: [test, deploy-staging, deploy-production]

    steps:
    - name: Clean up old artifacts
      run: |
        gh api repos/${{ github.repository }}/actions/artifacts \
          --jq '.artifacts[] | select(.created_at < (now - 30*24*3600 | strftime "%Y-%m-%dT%H:%M:%SZ")) | .id' \
          | xargs -I {} gh api repos/${{ github.repository }}/actions/artifacts/{} -X DELETE || true