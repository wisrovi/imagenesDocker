# https://hub.docker.com/_/sonarqube/
# https://github.com/SonarSource/docker-sonarqube/blob/master/example-compose-files/sq-with-postgres/docker-compose.yml

# Elasticsearch, que es un componente interno de SonarQube, requiere que el valor de vm.max_map_count sea mayor para poder manejar correctamente sus índices en memoria.
# Para solucionar este error, debes aumentar el límite de mapas de memoria virtual en el host donde corre Docker.
# ejecuta: sudo sysctl -w vm.max_map_count=262144

# para dejar este cambio permanente se necesita:
# sudo nano /etc/sysctl.conf
# al final del archivo añadir: vm.max_map_count=262144
# guarda cambios y comprueba con: sudo sysctl -p

# Es un límite del kernel sobre cuántas áreas de memoria virtual puede tener un proceso. Elasticsearch usa esto para mapear sus archivos de datos de forma eficiente mediante mmap.

version: '3'

services:
  sonarqube:
    image: sonarqube:25.10.0.114319-community
    hostname: sonarqube
    container_name: sonarqube
    read_only: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - ./data/sonarqube_data:/opt/sonarqube/data
      - ./data/sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_temp:/opt/sonarqube/temp
    #ports:
    #  - "9000:9000"
    networks:
      - ${NETWORK_TYPE:-ipv4}
  db:
    image: postgres:17
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    hostname: postgresql
    container_name: postgresql
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - postgresql:/var/lib/postgresql
    networks:
      - ${NETWORK_TYPE:-ipv4}

  sonarqube-ssl:
    image: nginx:latest
    restart: always
    ports:
      # - "80:80"
      - "9000:443"
    volumes:
      - ./certs:/etc/nginx/certs  # Directorio donde están los certificados SSL
      # - ./nginx/vhost.d:/etc/nginx/vhost.d
      # - ./nginx/html:/usr/share/nginx/html
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf  # Configuración personalizada de Nginx
    depends_on:
      - sonarqube

volumes:
  sonarqube_temp:
  sonarqube_logs:
  postgresql:


networks:
  ipv4:
    driver: bridge
    enable_ipv6: false
  dual:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: "192.168.2.0/24"
          gateway: "192.168.2.1"
        - subnet: "2001:db8:2::/64"
          gateway: "2001:db8:2::1"


# The default SonarQube credentials are: 
#     Username: admin
#     Password: admin




