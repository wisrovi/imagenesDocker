# Define la versión global de Python para ejecutar los hooks
default_language_version:
  python: python3

repos:
  # --- PROTECCIÓN DE FLUJO DE TRABAJO ---
  # Evita realizar commits directos en ramas protegidas
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, 001-DEVELOPMENT, --branch, 002-TEST, --branch, 003-PRODUCTION]

  # --- HOOKS BÁSICOS Y DE LIMPIEZA ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace      # Elimina espacios innecesarios al final de cada línea
      - id: end-of-file-fixer        # Asegura que el archivo termine con una única línea vacía
      - id: check-yaml               # Verifica sintaxis de archivos YAML
      - id: check-json               # Verifica sintaxis de archivos JSON
      - id: check-toml               # Verifica sintaxis de archivos TOML
      - id: check-ast                # Comprueba si el código Python es sintácticamente válido
      - id: check-added-large-files  # Bloquea archivos > 500KB
        args: ['--maxkb=500']

  # --- LINTING Y FORMATEO RÁPIDO (RUFF) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      - id: ruff                     # Linter ultra rápido con corrección automática
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format              # Formateador de código (estilo Black)

  # --- VERIFICACIÓN DE TIPOS (MYPY) ---
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports] # No falla si faltan librerías opcionales
        additional_dependencies: [pydantic, fastapi, types-requests, types-setuptools]

  # --- MODERNIZACIÓN DE CÓDIGO (REFURB) ---
  - repo: https://github.com/dosisod/refurb
    rev: v1.25.0
    hooks:
      - id: refurb
        exclude: ^template/

  # --- FORMATEO DE DOCUMENTACIÓN (MDFORMAT) ---
  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.22
    hooks:
      - id: mdformat
        args: ["--wrap", "120"]

  # --- SEGURIDAD ---
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: ["-lll", "-v"]         # Análisis de seguridad (severidad media/alta)

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets           # Evita subir credenciales o tokens
        args: ['--baseline', '.secrets.baseline']

  # --- INFRAESTRUCTURA Y AUTOMATIZACIÓN ---
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint                 # Linter para Dockerfiles

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.9.0
    hooks:
      - id: shellcheck               # Análisis estático para scripts Bash

  # --- CALIDAD Y CIENCIA DE DATOS ---
  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.6
    hooks:
      - id: codespell                # Revisa ortografía (ignora tu alias wisrovi)
        args: ["-L", "wisrovi"]

  - repo: https://github.com/kynan/nbstripout
    rev: 0.6.1
    hooks:
      - id: nbstripout               # Limpia outputs de Jupyter Notebooks antes del commit

  # --- SEGURIDAD AVANZADA EN DEPENDENCIAS ---
  - repo: https://github.com/pyupio/safety
    rev: v2.3.5
    hooks:
      - id: safety

  # --- CONFIGURACIÓN DE NGINX (SEGURIDAD) ---
  - repo: https://github.com/yandex/gixy
    rev: v0.1.20
    hooks:
      - id: gixy
        args: ["--level", "high"] # Solo errores críticos de seguridad

  # --- VALIDACIÓN DE INFRAESTRUCTURA (DOCKER COMPOSE) ---
  - repo: https://github.com/jonas-schievink/pre-commit-docker-compose
    rev: v1.0.0
    hooks:
      - id: docker-compose-check

  # --- VALIDACIÓN DE ARCHIVOS ENV (SEGURIDAD) ---
  # Asegura que los archivos .env.example tengan las mismas llaves que tus .env
  - repo: https://github.com/clintmod/pre-commit-hooks
    rev: v1.1.10
    hooks:
      - id: dotenv-checker

  # --- SEGURIDAD EN INFRAESTRUCTURA (IaC) ---
  # Escanea Docker y archivos de config en busca de malas prácticas de seguridad
  - repo: https://github.com/bridgecrewio/checkov
    rev: v3.2.1
    hooks:
      - id: checkov
        args: ["--directory", ".", "--compact", "--soft-fail"]

  # --- CALIDAD DE COMMITS Y CHANGELOG ---
  # Fuerza el estándar de commits para generar versiones automáticas
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.13.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # --- LINTER DE ARCHIVOS DE SISTEMA ---
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [json, yaml, markdown, scss]
        args: ["--print-width", "120"]

  # --- CUMPLIMIENTO Y LICENCIAS ---
  - repo: https://github.com/pujandm/python-license-check
    rev: v0.5.0
    hooks:
      - id: python-license-check

  # --- CALIDAD DE CÓDIGO (COMPLEJIDAD) ---
  - repo: https://github.com/pre-commit/mirrors-autopep8
    rev: v2.0.4
    hooks:
      - id: autopep8 # Correcciones menores de estilo PEP8 adicionales

  # --- CONTROL DE COMPLEJIDAD CICLOMÁTICA ---
  - repo: https://github.com/vikingco/pre-commit-python-xenon
    rev: v0.1.0
    hooks:
      - id: xenon
        args: ["--max-absolute B", "--max-modules A", "--max-average A"]
