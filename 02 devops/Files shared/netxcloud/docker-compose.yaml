version: '3.8'

services:
  # 1. Base de Datos (PostgreSQL)
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: nextcloud_db
      POSTGRES_USER: nextcloud_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}  # Usar variable de entorno
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - nextcloud_network

  # 2. Redis (Cache de Alto Rendimiento)
  redis:
    image: redis:alpine
    restart: always
    networks:
      - nextcloud_network

  # 3. Nextcloud Core (El DMS/Servidor de Archivos)
  app:
    image: nextcloud:latest
    restart: always
    links:
      - db
      - redis
    environment:
      # Configuración de la Base de Datos
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud_db
      POSTGRES_USER: nextcloud_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      
      # Configuración del Cache de Nextcloud
      REDIS_HOST: redis
      
      # Configuración de Dominio (Asegura que Nextcloud confíe en tu URL)
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_DOMAIN}
      
      # Credenciales del Administrador Inicial
      NEXTCLOUD_ADMIN_USER: ${ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      
      # Desactivar la verificación de host para facilitar el setup inicial (CAMBIAR A 'true' en PROD)
      OVERWRITEPROTOCOL: https 
    
    volumes:
      # - ./nextcloud_data:/var/www/html
      # - ./nextcloud_data:/var/www/html/data/files
      - /etc/localtime:/etc/localtime:ro # Sincronizar la hora del servidor
    networks:
      - nextcloud_network
      
  # 4. ONLYOFFICE Document Server (para Nextcloud Office)
  onlyoffice:
    image: onlyoffice/documentserver:latest
    restart: always
    environment:
      # La clave de JWT es importante para la seguridad entre Nextcloud y OnlyOffice
      # Debe generarse y configurarse también en la app de Nextcloud
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET} 
      
      # Configuración de la red (necesario si hay un proxy o dominios)
      VIRTUAL_HOST: ${ONLYOFFICE_DOMAIN}
      LETSENCRYPT_HOST: ${ONLYOFFICE_DOMAIN}
      
    volumes:
      - onlyoffice_data:/var/lib/onlyoffice
    networks:
      - nextcloud_network
      
# 5. Proxy/Gateway (Nginx + Certbot) - OPCIONAL PERO MUY RECOMENDADO
#    *Maneja el tráfico, la redirección a HTTPS y el certificado SSL.*
#    Si ya tienes un proxy Nginx o Caddy externo, puedes omitir este servicio
#    y mapear el puerto 443 del host al puerto 443 de 'app'.
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs
    networks:
      - nextcloud_network

# Definición de Volúmenes (Datos persistentes)
volumes:
  db_data:
  nextcloud_data:
  onlyoffice_data:

# Definición de la Red Interna
networks:
  nextcloud_network: