[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor/

[program:dockerd]
command=/usr/local/bin/dockerd-entrypoint.sh
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/dockerd.log
stderr_logfile=/var/log/supervisor/dockerd_error.log
priority=10

[program:node-exporter]
command=/usr/local/bin/node_exporter --web.listen-address=:9100
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/node_exporter.log
stderr_logfile=/var/log/supervisor/node_exporter_error.log
priority=5

[program:backup-cron]
command=/usr/local/bin/backup.sh
autostart=false
autorestart=false
stdout_logfile=/var/log/supervisor/backup.log
stderr_logfile=/var/log/supervisor/backup_error.log
priority=1