apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-kafka-smb-test
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: pv-kafka-smb-test
    volumeAttributes:
      source: //192.168.20.99/kubernetes/kafka
    nodeStageSecretRef:
      name: smb-credentials
      namespace: kafka
