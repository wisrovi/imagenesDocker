input {
  beats {
    port => 5044
  }
}

filter {
  if [fields][log_type] == "docker" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{WORD:level} %{GREEDYDATA:message}" }
    }
    mutate {
      add_field => { "service" => "%{[fields][service]}" }
    }
  }

  if [fields][log_type] == "application" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{WORD:level} %{DATA:component} %{GREEDYDATA:message}" }
    }
  }

  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "dind-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}