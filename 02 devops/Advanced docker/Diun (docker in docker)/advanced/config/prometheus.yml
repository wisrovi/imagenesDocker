global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'dind'
    static_configs:
      - targets: ['dind:9100']
    scrape_interval: 5s

  - job_name: 'portainer'
    static_configs:
      - targets: ['dind:9000']
    metrics_path: '/api/status'
    scrape_interval: 30s

  - job_name: 'docs'
    static_configs:
      - targets: ['docs-server:80']
    scrape_interval: 30s

