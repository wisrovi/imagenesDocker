services:
  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx.portinaer_ttyd
    depends_on:
      - worker
    ports:
      - "50421:9000"
      - "50423:7681"
    environment:
      - SCALE=5
    restart: unless-stopped

networks:
  default:
    name: diun
    external: true

volumes:
  worker_data:
  worker_docker: