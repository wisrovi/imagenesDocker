services:
  dispatcher:
    build:
      context: .
      dockerfile: docker/Dockerfile.dispatcher_ssh
    depends_on:
      - worker
    ports:
      - "50422:22"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.docker_and_ssh
    privileged: true
    cgroup: host
    entrypoint: /usr/local/bin/start.sh
    volumes:
      - worker_data:/data
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /tmp
      - /run
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    name: diun
    external: true

volumes:
  worker_data:
  worker_docker: