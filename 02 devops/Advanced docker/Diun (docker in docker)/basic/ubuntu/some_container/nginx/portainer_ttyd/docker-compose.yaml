services:
  dispatcher:
    build:
      context: .
      dockerfile: Dockerfile.dispatcher
    depends_on:
      - worker
    ports:
      - "50422:22"  # balancer and admin for ssh (all workers replicated)
    volumes:
      - ./scripts/dispatch.sh:/usr/local/bin/dispatch.sh
    networks:
      - dind-network
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    depends_on:
      - worker
    ports:
      - "50421:9000"  # Portainer
      - "50423:7681"  # Web Terminal (ttyd)
    environment:
      - SCALE=4
    networks:
      - dind-network
    restart: unless-stopped

  worker:
    build: ./../../
    privileged: true
    entrypoint: /usr/local/bin/start.sh
    volumes:
      - worker_data:/data
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /tmp
      - /run
    networks:
      - dind-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  dind-network:
    driver: bridge

volumes:
  worker_data:
  worker_docker: