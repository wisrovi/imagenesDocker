apiVersion: v1
kind: Pod
metadata:
  name: gpu-test-gpu-selector
spec:
  nodeSelector:
    nvidia.com/gpu.present: "true"
  restartPolicy: Never
  containers:
  - name: gpu-container
    image: nvidia/cuda:12.2.0-base-ubuntu22.04
    command: ["sh", "-c", "if [ -e /dev/nvidia0 ]; then echo 'GPU available'; else echo 'No GPU'; fi"]