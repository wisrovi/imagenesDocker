# para validar que nginx acepta la config, dentro del contenedor de nginx ejecutar: sudo nginx -t
# Si todo es correcto, verás un mensaje que dice syntax is ok y test is successful.


events {}

http {
    server {
        listen 443 ssl;
        server_name www.vault.ecapturedtech.com;
        client_max_body_size 100M;

        # Rutas de los certificados SSL
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Configuraciones de seguridad SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;

        # Añade la cabecera HSTS para forzar el uso de HTTPS en los navegadores
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        location / {
            # Establece la página de error personalizada
            error_page 502 /50x.html;

            # Proxy al servidor de SonarQube
            proxy_pass http://duplicati:8200;

            # Encabezados para que el backend de SonarQube sepa quién es el cliente
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Ssl on;            

            # Timeout para evitar que las conexiones se cierren prematuramente
            proxy_read_timeout 360s;

            # Headers para habilitar WebSockets en Nginx
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Ubicación de la página de error personalizada
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}