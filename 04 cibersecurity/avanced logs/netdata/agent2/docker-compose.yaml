version: '3'
services:
  netdata:
    image: netdata/netdata:stable
    container_name: netdata_agent2
    pid: host
    network_mode: host
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /:/host/root:ro,rslave
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/log:/host/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/dbus:/run/dbus:ro
    environment:
      - NETDATA_CLAIM_TOKEN=YggiZavss1Tyrkd5kYNhs5WETXs_IRRsaUxiUW87ZNOyFfEGMmKBOD0Z0v5cqBjt_fkffl-jU42JNhVqkKiu6T_HcaVHm-a4BfKrdcbVaaTVgvoPAR-gGperhm-j83RqrPZ4R5M
      - NETDATA_CLAIM_URL=https://app.netdata.cloud
      - NETDATA_CLAIM_ROOMS=af31732c-1e0f-402e-860a-e04ce70cc7ea
volumes:
  netdataconfig:
  netdatalib:
  netdatacache:
